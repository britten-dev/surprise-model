<!doctype html>
<meta charset="utf-8">
<title>Surprise build harness</title>
<script src="/viewer/importmap.js"></script>
<body style="margin:0;background:#111;color:#ccc;font:13px ui-monospace,monospace">
<pre id="log">booting…</pre>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { buildShip, LODS, SAIL_STATES } from '/src/ship/index.js';
import { measureShip } from '/src/audit/measure.js';

const log = (m) => { document.getElementById('log').textContent += '\n' + m; };

window.THREE = THREE;
window.LODS = LODS;
window.SAIL_STATES = SAIL_STATES;

// Build once and cache, because build + audit + render all want the same object and
// rebuilding is the expensive part.
const cache = new Map();
window.build = (opts) => {
  const key = JSON.stringify(opts);
  if (!cache.has(key)) {
    const t0 = performance.now();
    cache.set(key, buildShip(opts));
    log(`built ${key} in ${(performance.now() - t0).toFixed(0)} ms`);
  }
  return cache.get(key);
};

window.exportGLB = async (opts) => {
  const ship = window.build(opts);
  const scene = new THREE.Scene();
  scene.add(ship);
  const exporter = new GLTFExporter();
  const buf = await exporter.parseAsync(scene, { binary: true, onlyVisible: true });
  // Base64 so the result crosses the CDP bridge as a plain string.
  let bin = '';
  const bytes = new Uint8Array(buf);
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
};

window.stats = (opts) => {
  const ship = window.build(opts);
  let tris = 0, verts = 0, meshes = 0, lines = 0, materials = new Set();
  ship.traverse((o) => {
    if (o.isMesh) {
      meshes++;
      const g = o.geometry;
      const n = g.index ? g.index.count : g.attributes.position.count;
      const inst = o.isInstancedMesh ? o.count : 1;
      tris += (n / 3) * inst;
      verts += g.attributes.position.count * inst;
      (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => materials.add(m.uuid));
    } else if (o.isLineSegments) {
      lines += o.geometry.attributes.position.count / 2;
    }
  });
  return { tris: Math.round(tris), verts, meshes, lines, materials: materials.size };
};

window.measure = (opts) => measureShip(window.build(opts));

window.SHIP_READY = true;
log('ready');
</script>
