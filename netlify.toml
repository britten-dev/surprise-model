# The deployed site is the interactive viewer. It builds the ship in the browser from
# the generator source, so there is nothing to bake and no model files to ship.

[build]
  command = "node tools/build-site.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # three is a PEER dependency of this package — the host provides it, so that a consumer
  # never ends up with two copies of the library on one page. That means it is not
  # installed by `--omit=dev`, and the site build needs it: the viewer imports it. So the
  # dev dependencies are installed, and Playwright is told not to fetch a browser it will
  # never open here, which is what `--omit=dev` was really for.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    # The viewer is a static page that loads only its own modules.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
